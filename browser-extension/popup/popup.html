<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDYOR Token Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="../icons/icon-32.png" alt="AIDYOR" width="24" height="24">
        <span class="logo-text">AIDYOR</span>
      </div>
      <span class="tagline">AI Risk Scanner</span>
    </header>

    <!-- Scanner Input -->
    <div class="scanner-section">
      <div class="input-group">
        <input 
          type="text" 
          id="addressInput" 
          class="address-input" 
          placeholder="Paste token address (0x... or Solana)"
          spellcheck="false"
          autocomplete="off"
        >
        <button id="scanBtn" class="scan-btn" title="Scan Token">
          <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </button>
      </div>
      <div class="network-selector">
        <label>Network:</label>
        <select id="networkSelect" class="network-select">
          <option value="auto">Auto-detect</option>
          <option value="eth">Ethereum</option>
          <option value="bsc">BNB Chain</option>
          <option value="solana">Solana</option>
          <option value="polygon">Polygon</option>
          <option value="arbitrum">Arbitrum</option>
          <option value="base">Base</option>
          <option value="optimism">Optimism</option>
          <option value="avalanche">Avalanche</option>
        </select>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Analyzing token security...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="error-state hidden">
      <div class="error-icon">⚠️</div>
      <p id="errorMessage">Unable to scan token</p>
      <button id="retryBtn" class="retry-btn">Try Again</button>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="results-section hidden">
      <!-- Token Info -->
      <div class="token-info">
        <img id="tokenImage" class="token-image" src="" alt="" onerror="this.style.display='none'">
        <div class="token-details">
          <span id="tokenName" class="token-name">Token Name</span>
          <span id="tokenSymbol" class="token-symbol">SYMBOL</span>
        </div>
        <span id="tokenNetwork" class="network-badge">ETH</span>
      </div>

      <!-- Risk Score -->
      <div class="risk-score-container">
        <div id="riskGauge" class="risk-gauge">
          <svg viewBox="0 0 120 70" class="gauge-svg">
            <defs>
              <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#ef4444"/>
                <stop offset="50%" style="stop-color:#f59e0b"/>
                <stop offset="100%" style="stop-color:#22c55e"/>
              </linearGradient>
            </defs>
            <path 
              d="M 10 60 A 50 50 0 0 1 110 60" 
              fill="none" 
              stroke="rgba(255,255,255,0.1)" 
              stroke-width="8"
              stroke-linecap="round"
            />
            <path 
              id="gaugeProgress"
              d="M 10 60 A 50 50 0 0 1 110 60" 
              fill="none" 
              stroke="url(#gaugeGradient)" 
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="157"
              stroke-dashoffset="157"
            />
            <text id="scoreText" x="60" y="55" text-anchor="middle" class="score-text">--</text>
          </svg>
        </div>
        <div id="riskLevel" class="risk-level">ANALYZING</div>
      </div>

      <!-- Quick Stats -->
      <div class="quick-stats">
        <div class="stat-item">
          <span class="stat-label">Honeypot</span>
          <span id="honeypotStatus" class="stat-value status-unknown">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Buy Tax</span>
          <span id="buyTax" class="stat-value">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Sell Tax</span>
          <span id="sellTax" class="stat-value">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Liquidity</span>
          <span id="liquidity" class="stat-value">--</span>
        </div>
      </div>

      <!-- Risk Factors -->
      <div class="risk-factors">
        <h3 class="section-title">Risk Factors</h3>
        <ul id="riskFactorsList" class="risk-factors-list">
          <!-- Populated by JS -->
        </ul>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="viewFullReport" class="action-btn primary">
          View Full Report
        </button>
        <button id="copyResults" class="action-btn secondary">
          Copy Results
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">🔍</div>
      <p>Enter a token address above to analyze its risk score</p>
      <div class="supported-chains">
        <span class="chain-badge">ETH</span>
        <span class="chain-badge">BSC</span>
        <span class="chain-badge">SOL</span>
        <span class="chain-badge">POLY</span>
        <span class="chain-badge">ARB</span>
        <span class="chain-badge">BASE</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://aidyor.app" target="_blank" class="footer-link">aidyor.app</a>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
