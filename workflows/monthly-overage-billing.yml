name: Monthly API Overage Billing

on:
  schedule:
    # Runs at 06:00 UTC on the 2nd of every month (gives a day of buffer
    # after month-end for any late-arriving usage before billing runs)
    - cron: '0 6 2 * *'
  workflow_dispatch: {} # allows manual trigger from the Actions tab, e.g. to re-run or test

jobs:
  run-overage-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger overage billing function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://lerromdxykuydrpttfif.supabase.co/functions/v1/api-billing-overage" \
            -H "Content-Type: application/json" \
            -H "x-billing-secret: ${{ secrets.BILLING_CRON_SECRET }}" \
            -d '{}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Overage billing run failed with status $http_code"
            exit 1
          fi
